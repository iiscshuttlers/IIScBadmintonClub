    <!-- ✅ SPA Base Path Self-Correction & Redirect Restore -->
    <script>
      (function () {
        const base = "/IIScBadmintonClub";
        if (window.location.hostname.endsWith("github.io")) {
          if (!window.location.pathname.startsWith(base)) {
            const corrected = base + (window.location.pathname.startsWith("/") ? window.location.pathname : "/" + window.location.pathname) + window.location.search + window.location.hash;
            window.history.replaceState(null, "", corrected);
          }
        }
        const redirect = sessionStorage.getItem("redirect");
        if (redirect) {
          sessionStorage.removeItem("redirect");
          let target = redirect;
          if (window.location.hostname.endsWith("github.io") && !target.startsWith(base)) {
            target = base + (target.startsWith("/") ? target : "/" + target);
          }
          window.history.replaceState(null, "", target);
        }
      })();



      // ✅ Theme boot — apply the saved theme before React loads (no flash of the
      // wrong colours) and load only that theme's fonts. Mirrors lib/themes.ts and
      // styles/themes.css: [page background, accent, isDark, Google Fonts families].
      (function () {
        var THEMES = {
          floodlight: ["#0a1020", "#ffc83d", 1, "family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800"],
          "centre-court": ["#eef3ee", "#0a7a53", 0, "family=Plus+Jakarta+Sans:wght@400;500;600;700;800"],
          smash: ["#0c0913", "#8b6cff", 1, "family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800"],
          paper: ["#f5f5f1", "#2347ff", 0, "family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800"],
          heritage: ["#0b1611", "#e3b448", 1, "family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800"]
        };
        var id = "floodlight";
        try {
          var saved = localStorage.getItem("app-theme");
          if (saved && THEMES[saved]) id = saved;
        } catch (e) {}
        var t = THEMES[id];
        var root = document.documentElement;
        root.setAttribute("data-theme", id);
        if (t[2]) root.classList.add("dark");
        root.style.colorScheme = t[2] ? "dark" : "light";
        root.style.setProperty("--boot-bg", t[0]);
        root.style.setProperty("--boot-accent", t[1]);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", t[0]);
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.crossOrigin = "anonymous";
        link.href = "https://fonts.googleapis.com/css2?" + t[3] + "&display=swap";
        link.setAttribute("data-theme-fonts", id);
        document.head.appendChild(link);
      })();
    </script>



    <!-- Google Fonts: the boot script above adds the stylesheet for the saved theme only -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <div id="root">
      <style>
        /* Paint the saved theme's background before JS boots (set by the boot script) */
        body, html { background-color: var(--boot-bg, var(--background, #0a1020)); }
        #initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: var(--boot-bg, var(--background, #0a1020));
          z-index: 9999;
          transition: opacity 0.3s ease;
        }
        .spinner {
          width: 48px;
          height: 48px;
          border: 4px solid color-mix(in srgb, var(--boot-accent, var(--primary, #ffc83d)) 20%, transparent);
          border-left-color: var(--boot-accent, var(--primary, #ffc83d));
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div id="initial-loader">
        <div class="spinner"></div>
      </div>
      <script>
        // Remove the initial loader as soon as React has rendered real content
        // (MutationObserver watches for React replacing the loader div)
        (function () {
          var loader = document.getElementById('initial-loader');
          if (!loader) return;
          var obs = new MutationObserver(function () {
            // React will remove the loader element when it takes over #root
            if (!document.getElementById('initial-loader')) {
              obs.disconnect();
              return;
            }
            // If React added siblings (real UI), fade and remove the loader
            var root = document.getElementById('root');
            if (root && root.children.length > 1) {
              loader.style.opacity = '0';
              setTimeout(function () { loader.remove(); }, 300);
              obs.disconnect();
            }
          });
          obs.observe(document.getElementById('root'), { childList: true, subtree: false });
          // Hard failsafe: remove after 8s no matter what
          setTimeout(function () { loader && loader.remove(); }, 8000);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
