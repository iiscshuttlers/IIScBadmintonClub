    <!-- ✅ SPA Base Path Self-Correction & Redirect Restore -->
    <script>
      (function () {
        const base = "/IIScBadmintonClub";
        if (window.location.hostname.endsWith("github.io")) {
          if (!window.location.pathname.startsWith(base)) {
            const corrected = base + (window.location.pathname.startsWith("/") ? window.location.pathname : "/" + window.location.pathname) + window.location.search + window.location.hash;
            window.history.replaceState(null, "", corrected);
          }
        }
        const redirect = sessionStorage.getItem("redirect");
        if (redirect) {
          sessionStorage.removeItem("redirect");
          let target = redirect;
          if (window.location.hostname.endsWith("github.io") && !target.startsWith(base)) {
            target = base + (target.startsWith("/") ? target : "/" + target);
          }
          window.history.replaceState(null, "", target);
        }
      })();



      // ✅ Theme Persistence
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          const accent = localStorage.getItem('accent');
          if (theme === 'dark' || !theme) {
            document.documentElement.classList.add('dark');
          }
          if (accent && accent !== 'emerald') {
            document.documentElement.setAttribute('data-accent', accent);
          }
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root">
      <style>
        /* Prevent white flash on dark-mode Android before JS boots */
        body, html { background-color: #020617; }
        html:not(.dark) body, html:not(.dark) { background-color: #ffffff; }
        #initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #ffffff;
          z-index: 9999;
          transition: opacity 0.3s ease;
        }
        html.dark #initial-loader {
          background-color: #020617; /* tailwind slate-950 */
        }
        .spinner {
          width: 48px;
          height: 48px;
          border: 4px solid rgba(16, 185, 129, 0.2); /* emerald-500 with opacity */
          border-left-color: #10b981; /* emerald-500 */
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div id="initial-loader">
        <div class="spinner"></div>
      </div>
      <script>
        // Remove the initial loader as soon as React has rendered real content
        // (MutationObserver watches for React replacing the loader div)
        (function () {
          var loader = document.getElementById('initial-loader');
          if (!loader) return;
          var obs = new MutationObserver(function () {
            // React will remove the loader element when it takes over #root
            if (!document.getElementById('initial-loader')) {
              obs.disconnect();
              return;
            }
            // If React added siblings (real UI), fade and remove the loader
            var root = document.getElementById('root');
            if (root && root.children.length > 1) {
              loader.style.opacity = '0';
              setTimeout(function () { loader.remove(); }, 300);
              obs.disconnect();
            }
          });
          obs.observe(document.getElementById('root'), { childList: true, subtree: false });
          // Hard failsafe: remove after 8s no matter what
          setTimeout(function () { loader && loader.remove(); }, 8000);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
