    <!-- ✅ SPA Redirect Restore (REQUIRED) -->
    <script>
      (function () {
        const redirect = sessionStorage.getItem("redirect");
        if (redirect) {
          sessionStorage.removeItem("redirect");
          const base = "/IIScBadmintonClub";
          let target = redirect;
          if (window.location.hostname.endsWith("github.io") && !target.startsWith(base)) {
            target = base + (target.startsWith("/") ? target : "/" + target);
          }
          window.history.replaceState(null, null, target);
        }
      })();



      // ✅ Theme Persistence
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          const accent = localStorage.getItem('accent');
          if (theme === 'dark' || !theme) {
            document.documentElement.classList.add('dark');
          }
          if (accent && accent !== 'emerald') {
            document.documentElement.setAttribute('data-accent', accent);
          }
        } catch (e) {}
      })();
    </script>

        #initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;

          background-color: #ffffff;

        html.dark #initial-loader {

        }
        .spinner {
          width: 48px;
          height: 48px;
          border: 4px solid rgba(16, 185, 129, 0.2); /* emerald-500 with opacity */
          border-left-color: #10b981; /* emerald-500 */
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div id="initial-loader">
