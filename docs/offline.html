<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're Offline | IISc Badminton Club</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: linear-gradient(
          135deg,
          #0f172a 0%,
          #1e3a5f 50%,
          #064e3b 100%
        );
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        padding: 1.5rem;
        overflow: hidden;
      }

      /* court background lines */
      .court-bg {
        position: fixed;
        inset: 0;
        opacity: 0.04;
        pointer-events: none;
      }

      /* glow orbs */
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
      }
      .orb-1 {
        width: 400px;
        height: 400px;
        background: #10b981;
        opacity: 0.08;
        top: -100px;
        left: -100px;
      }
      .orb-2 {
        width: 300px;
        height: 300px;
        background: #3b82f6;
        opacity: 0.08;
        bottom: -80px;
        right: -80px;
      }

      .card {
        position: relative;
        z-index: 10;
        text-align: center;
        max-width: 480px;
        width: 100%;
        animation: fadeUp 0.5s ease both;
      }

      .icon-wrap {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.15);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2rem;
        animation: pulse 2.5s ease-in-out infinite;
      }

      .icon-wrap svg {
        width: 44px;
        height: 44px;
        color: #10b981;
        stroke: #10b981;
      }

      h1 {
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        font-weight: 800;
        margin-bottom: 1rem;
        letter-spacing: -0.02em;
      }

      p {
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.7;
        font-size: 1rem;
        margin-bottom: 2.5rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #10b981;
        color: white;
        font-weight: 700;
        font-size: 1rem;
        padding: 0.85rem 2rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        transition:
          background 0.2s,
          transform 0.2s;
        box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35);
        margin-bottom: 1rem;
      }
      .btn:hover {
        background: #059669;
        transform: translateY(-2px);
      }

      .hint {
        color: rgba(255, 255, 255, 0.35);
        font-size: 0.8rem;
        margin-top: 1.5rem;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 1.5rem 0;
        color: rgba(255, 255, 255, 0.2);
        font-size: 0.8rem;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
      }

      .cached-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
      }

      .cached-link {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 0.35rem 0.85rem;
        border-radius: 999px;
        text-decoration: none;
        transition: all 0.2s;
      }
      .cached-link:hover {
        color: white;
        background: rgba(255, 255, 255, 0.12);
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
    </style>
  </head>
  <body>
    <!-- Background court lines -->
    <svg class="court-bg" viewBox="0 0 800 600" preserveAspectRatio="none">
      <line x1="400" y1="0" x2="400" y2="600" stroke="white" stroke-width="2" />
      <line x1="0" y1="300" x2="800" y2="300" stroke="white" stroke-width="2" />
      <ellipse
        cx="400"
        cy="300"
        rx="150"
        ry="110"
        stroke="white"
        stroke-width="2"
        fill="none"
      />
      <rect
        x="80"
        y="80"
        width="640"
        height="440"
        stroke="white"
        stroke-width="3"
        fill="none"
      />
    </svg>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="card">
      <div class="icon-wrap">
        <!-- Wifi-off icon -->
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="1" y1="1" x2="23" y2="23" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <circle cx="12" cy="20" r="1" fill="currentColor" />
        </svg>
      </div>

      <h1>You're Offline</h1>
      <p>
        No internet connection detected. Some pages may still be available from
        cache — or try again when you're back online.
      </p>

      <button class="btn" onclick="window.location.reload()">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
        Try Again
      </button>

      <div class="divider">cached pages</div>

      <div class="cached-links">
        <a class="cached-link" href="/iiscshuttlers/">Home</a>
        <a class="cached-link" href="/iiscshuttlers/events">Events</a>
        <a class="cached-link" href="/iiscshuttlers/legacy">Legacy</a>
        <a class="cached-link" href="/iiscshuttlers/about">About</a>
        <a class="cached-link" href="/iiscshuttlers/facilities">Facilities</a>
      </div>

      <p class="hint">IISc Badminton Club · Bangalore, India</p>
    </div>
  </body>
</html>
