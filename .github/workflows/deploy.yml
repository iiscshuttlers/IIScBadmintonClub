name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and Test
        run: |
          pnpm run check
          pnpm run test run

      - name: Build site
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: "https://gewnvlanitzlukaiiznu.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_dWERfMPzKYO5Cxyj35vsUg_xnjwzdNx"
          VITE_FIREBASE_API_KEY: "AIzaSyBswPW816r-G3UDRoQSf5eZLRSIlFHtJnc"
          VITE_FIREBASE_AUTH_DOMAIN: "iisc-badminton-hub.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "iisc-badminton-hub"
          VITE_FIREBASE_STORAGE_BUCKET: "iisc-badminton-hub.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "258810088674"
          VITE_FIREBASE_APP_ID: "1:258810088674:web:457a6da843a1712d69a2bb"
          VITE_FIREBASE_VAPID_KEY: "BJLO-mUIwu6w-YjtFIesznIM-JtQsi4EVxQxfh7-SZmh-zciHcJgOdClL8TWXURLr7MZkHu1zOGPPX8M8GB9hfw"
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: pnpm build

      - name: Copy index.html to 404.html
        run: cp ./dist/index.html ./dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
