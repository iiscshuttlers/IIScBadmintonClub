name: E2E tests

# Browser journeys (Playwright). Every spec answers Supabase from local
# fixtures via page.route, so no secrets or live data are needed. Runs on
# PRs and on main, separate from the Pages deploy so a flaky browser test
# never blocks a production release.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The dev server reads .env.local; the committed production values are
      # public client keys, and every request the specs make is intercepted.
      - name: Dev server env
        run: cp .env.production .env.local

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The WP10 performance baseline is a local benchmark (npm run
      # benchmark:wp10), not a pass/fail check, so it is skipped here.
      - name: Run Playwright
        run: pnpm exec playwright test --grep-invert "performance baselines"

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
